<div style="display:none">
    Sewon Min, architecture, arctic, birds, books, fiction, fish, mapping, poetry  
  </div>
<div class="hero"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // 1️⃣ 모바일 감지 (userAgent 기준)
  const ua = navigator.userAgent || navigator.vendor || window.opera;
  const isMobile =
    /android/i.test(ua) ||
    /iphone/i.test(ua) ||
    /ipod/i.test(ua) ||
    (/ipad/i.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua)));

  // 2️⃣ 이미지 배열 완전히 분리
  const desktopImages = [
    'img/1.jpg',
    'img/2.jpg',
    'img/3.png',
    'img/4.jpg',
    'img/5.jpg',
    'img/6.png',
    'img/7.jpg',
    'img/8.jpg',
    'img/9.jpg',
    'img/10.jpg',
  ];

  const mobileImages = [
    'img/m1.jpg',
    'img/m2.jpg',      
    'img/m3.jpg',
    'img/3.png',
    'img/4.jpg',
    'img/5.jpg',
    'img/6.png',
    'img/7.jpg',
    'img/8.jpg',
    'img/m9.jpg',
    'img/10.jpg',
  ];

  // 3️⃣ 모바일이면 mobileImages, 아니면 desktopImages 사용
  const images = isMobile ? mobileImages : desktopImages;

  // 4️⃣ 배경 전환
  const hero = document.querySelector('.hero');
  let index = 0;

  hero.style.backgroundImage = `url(${images[index]})`;

  function nextImage() {
    index = (index + 1) % images.length;
    const nextSrc = images[index];
    const preloader = new Image();
    preloader.src = nextSrc;
    preloader.onload = () => {
      hero.style.backgroundImage = `url(${nextSrc})`;
    };
  }
const intervalTime = isMobile ? 1000 : 2000; 
setInterval(nextImage, intervalTime);
});
</script>
  
</body>
